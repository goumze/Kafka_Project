# Extends docker-compose.yml (Kafka brokers) with API + scalable consumers.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d --scale kafka-consumer=3
#
# Demo:
#   1. POST http://localhost:8000/events/bulk/generate
#   2. GET  http://localhost:8000/metrics   (watch total_lag)
#   3. scale kafka-consumer and watch lag drain

x-backend-env: &backend-env
  KAFKA_BROKERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
  CONSUMER_GROUP: streamsocial_event_consumers
  LOG_LEVEL: INFO
  # Demo partitions (enough for multi-replica scale; override as needed)
  PARTITIONS_USER_ACTIONS: "24"
  PARTITIONS_CONTENT_INTERACTIONS: "12"
  PARTITIONS_SYSTEM_EVENTS: "6"
  KAFKA_REPLICATION_FACTOR: "3"
  # Producer throughput
  PRODUCER_LINGER_MS: "50"
  PRODUCER_BATCH_SIZE: "32768"
  PRODUCER_COMPRESSION: gzip
  LOADGEN_BURST_SIZE: "100"
  # Consumer lag demo: processing delay makes lag easy to induce with 1 replica
  CONSUMER_PROCESSING_DELAY_MS: "5"
  CONSUMER_MAX_POLL_RECORDS: "50"
  CONSUMER_LAG_LOG_INTERVAL_SEC: "5"
  API_EMBED_CONSUMER: "false"

services:
  backend-api:
    build:
      context: ./streamsocial/backend
      dockerfile: Dockerfile
    # no fixed container_name so compose project naming stays flexible
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - kafka-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  # Horizontally scalable consumer workers (same CONSUMER_GROUP).
  # Scale with: --scale kafka-consumer=N
  kafka-consumer:
    build:
      context: ./streamsocial/backend
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      backend-api:
        condition: service_started
    networks:
      - kafka-network
    command: ["python", "-m", "workers.consumer_worker"]
    stop_grace_period: 20s
    restart: unless-stopped
    # default one replica; scale out for lag drain demo
    deploy:
      replicas: 1

networks:
  kafka-network:
    driver: bridge
