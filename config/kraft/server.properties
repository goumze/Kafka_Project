############################# KRaft Mode Settings #############################
# Run as both Kafka broker and Raft controller (single-node setup)
process.roles=broker,controller

# Unique node ID within the cluster
node.id=1

# Controller quorum: nodeId@host:controllerPort
controller.quorum.voters=1@localhost:9093

############################# Socket / Listener Settings #############################
# PLAINTEXT for client connections, CONTROLLER for internal Raft communication
listeners=PLAINTEXT://:9092,CONTROLLER://:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

# Number of threads for network and I/O operations
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Log Storage #############################
# Directory where Kafka stores its log segments
log.dirs=/tmp/kafka-logs

# Default number of partitions per topic
num.partitions=3

# Number of threads for log recovery on startup / shutdown
num.recovery.threads.per.data.dir=1

############################# Replication #############################
# Replication factor of 1 is correct for a single-broker setup
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

############################# Log Retention #############################
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
