spring:
  application:
    name: uberlite-lesson-01
  
  # DataSource Configuration for PostgreSQL
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:myapp_db}?sslmode=disable&options=-c%20TimeZone=UTC
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      connection-init-sql: SET TIME ZONE 'UTC'

  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          time_zone: UTC
        order_inserts: true
        order_updates: true

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      compression-type: gzip
      properties:
        linger.ms: 10
        batch.size: 32768
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094,localhost:9096}
      group-id: ${KAFKA_CONSUMER_GROUP:uberlite-lesson-01}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval-ms: 1000
      properties:
        spring.json.trusted.packages: "*"
        max.poll.records: 500

# Server Configuration
server:
  port: ${SERVER_PORT:8091}
  servlet:
    context-path: /api
  tomcat:
    threads:
      max: 200
      min-spare: 10

# Actuator Configuration (Metrics & Health)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      simple:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.uberlite: DEBUG
    org.springframework.kafka: INFO
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Application-specific Configuration
app:
  mode: ${APP_MODE:both}  # Options: postgres, kafka, both
  load-generator:
    num-drivers: ${LOAD_GEN_DRIVERS:1000}
    events-per-second: ${LOAD_GEN_EPS:3000}
  metrics:
    report-interval-seconds: 10
