spring:
  application:
    name: streamsocial-api
  
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${SPRING_KAFKA_PRODUCER_ACKS:all}
      compression-type: ${SPRING_KAFKA_PRODUCER_COMPRESSION_TYPE:gzip}
      linger-ms: ${SPRING_KAFKA_PRODUCER_LINGER_MS:50}
      batch-size: ${SPRING_KAFKA_PRODUCER_BATCH_SIZE:32768}
      
    # Consumer config (for monitoring only, not used in API)
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:streamsocial_event_consumers}
      auto-offset-reset: ${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "com.streamsocial.*"

server:
  port: ${SERVER_PORT:8000}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.streamsocial: ${LOGGING_LEVEL_COM_STREAMSOCIAL:DEBUG}
    org.springframework.kafka: INFO

---
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    root: INFO
